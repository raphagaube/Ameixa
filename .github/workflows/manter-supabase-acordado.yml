# Consulta leve ao banco todo dia.
#
# No plano gratuito, o Supabase pausa o projeto depois de 7 dias sem uso —
# e o app inteiro para, com "Sem conexão com o servidor" na tela de entrada.
# Uma consulta por dia conta como uso. Se a consulta falhar (projeto pausado,
# chave trocada), o GitHub avisa por e-mail que a rotina quebrou: serve de
# alarme.
#
# Atenção: o GitHub desliga rotinas agendadas em repositórios sem commits há
# 60 dias. Se o app ficar esse tempo sem mudança, é preciso religar em
# Actions → Manter o Supabase acordado → Enable workflow.
name: Manter o Supabase acordado

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 06:17 em Brasília (09:17 UTC)
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # A chave pública só enxerga o que o RLS deixa: a resposta é uma
          # lista vazia, mas o banco recebeu e processou a consulta.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -H "apikey: $CHAVE" -H "Authorization: Bearer $CHAVE" \
            "$URL/rest/v1/perfis?select=id&limit=1")
          echo "Resposta do Supabase: HTTP $codigo"
          test "$codigo" = "200"
